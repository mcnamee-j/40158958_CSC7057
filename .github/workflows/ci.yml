name: CI

on:
  push:
    branches: [main, develop, "sprint*"] #runs everytime there is a push to main or develop branches
  pull_request:
    branches: [main, develop] #same as above except for pull reqs

jobs:
  build:
    runs-on: ubuntu-latest #will give same results as Mac and Windows - free to use

    strategy:
      matrix:
        node-version: [26]

    #test database setup using postgres v.15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: loop_test
        ports:
          - 5432:5432
        options: >- #ensures db is ready before trying any connections
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    #env variables
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: loop_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      ACCESS_SECRET: test_access_secret
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_USER: ""
      MAIL_PASS: ""
      MAIL_FROM: noreply@loop.com
      APP_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - name: Download repo
        uses: actions/checkout@v4

      - name: Sets up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
          cache: npm #remebers modules so it doesnt have to redownload on every call
          cache-dependency-path: |
            app/server/package-lock.json
            app/client/package-lock.json

      - name: Install dependencies (server)
        working-directory: app/server
        run: npm ci #installs versions in package-lock.json file

        #keep eye on this if ever update sql files
      - name: Run test db schema
        working-directory: app/server
        run: |
          PGPASSWORD=test_password psql \
            -h localhost \
            -U test_user \
            -d loop_test \
            -f src/config/40158958_project.sql

      - name: Run seed data
        working-directory: app/server
        run: |
          PGPASSWORD=test_password psql \
            -h localhost \
            -U test_user \
            -d loop_test \
            -f src/config/db.sql

      - name: Type check (server)
        working-directory: app/server
        run: npx tsc --noEmit #checks all ts files (--noEmit avoids creation of js files)

      - name: Run tests - Vitest (server)
        working-directory: app/server
        run: npm test

      - name: Build (server)
        working-directory: app/server
        run: npm run build #runs package.json

      # client side
      - name: Install dependencies (client)
        working-directory: app/client
        run: npm ci

      - name: Type check (client)
        working-directory: app/client
        run: npx tsc --noEmit

      - name: Run tests - Vitest (Client)
        working-directory: app/client
        run: npm test

      - name: Build (client)
        working-directory: app/client
        run: npm run build
